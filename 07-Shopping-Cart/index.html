<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS1510 - Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- AUTH MODAL -->
  <div id="authModal" class="modal-overlay">
    <div class="auth-box">
      <h2>Campus Store</h2>
      <p class="auth-sub">CS1510 Shopping Cart Application</p>

      <div class="auth-tabs">
        <button id="authLoginTab" class="tab-btn active">Sign In</button>
        <button id="authRegisterTab" class="tab-btn">Register</button>
      </div>

      <div id="authAlert" class="alert hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginUser">Username:</label>
          <input type="text" id="loginUser" placeholder="e.g., shopper1" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPass">Password:</label>
          <input type="password" id="loginPass" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn primary-btn full-width">Sign In</button>
        <div class="demo-box">
          <span>Demo Account:</span>
          <button type="button" class="demo-btn" data-u="shopper1" data-p="123456">shopper1</button>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label for="regUser">Choose Username:</label>
          <input type="text" id="regUser" placeholder="e.g., user1" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="regPass">Password:</label>
          <input type="password" id="regPass" placeholder="Min 4 characters" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn primary-btn full-width">Register</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appWrapper" class="hidden">
    <header class="navbar">
      <div class="nav-content">
        <div class="brand">
          <h2>Campus Store</h2>
        </div>

        <nav class="nav-tabs">
          <button id="navCatalogueBtn" class="nav-tab active">Product Catalogue</button>
          <button id="navCartBtn" class="nav-tab">Cart (<span id="navCartBadge">0</span>)</button>
        </nav>

        <div class="user-controls">
          <span>User: <strong id="headerUsername">User</strong></span>
          <button id="logoutBtn" class="btn small-btn">Logout</button>
        </div>
      </div>
    </header>

    <main class="main-body">
      <!-- 1. PRODUCT CATALOGUE VIEW -->
      <section id="catalogueView" class="view-panel">
        <div class="toolbar">
          <div class="category-filters" id="categoryFilters">
            <button class="cat-btn active" data-cat="all">All</button>
            <button class="cat-btn" data-cat="Electronics">Electronics</button>
            <button class="cat-btn" data-cat="Stationery">Stationery</button>
            <button class="cat-btn" data-cat="Books">Books</button>
            <button class="cat-btn" data-cat="Accessories">Accessories</button>
          </div>
          <input type="text" id="catalogueSearch" placeholder="Search products..." class="search-input">
        </div>

        <div id="productGrid" class="product-grid"></div>
      </section>

      <!-- 2. SHOPPING CART VIEW -->
      <section id="cartView" class="view-panel hidden">
        <div class="cart-view-header">
          <h2>Shopping Cart</h2>
          <button id="continueShoppingBtn" class="btn">&larr; Back to Catalogue</button>
        </div>

        <div class="cart-layout">
          <div class="cart-table-card">
            <div id="cartItemsList"></div>
          </div>

          <aside class="order-summary-card">
            <h3>Order Summary</h3>
            <div class="summary-breakdown">
              <div class="summary-row">
                <span>Subtotal:</span>
                <span id="summarySubtotal">Rs. 0.00</span>
              </div>
              <div class="summary-row">
                <span>Student Discount (5%):</span>
                <span id="summaryDiscount">-Rs. 0.00</span>
              </div>
              <div class="summary-row">
                <span>Tax (10%):</span>
                <span id="summaryTax">Rs. 0.00</span>
              </div>
              <div class="summary-row grand-total-row">
                <strong>Total:</strong>
                <strong id="summaryGrandTotal">Rs. 0.00</strong>
              </div>
            </div>

            <button id="btnProceedCheckout" class="btn primary-btn full-width checkout-btn" disabled>
              Checkout
            </button>
            <button id="clearCartBtn" class="clear-cart-link">Clear Cart</button>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutReceiptModal" class="modal-overlay hidden">
    <div class="receipt-box">
      <h3>Purchase Receipt</h3>
      <p>Invoice: <strong id="receiptInvoiceNo">#INV-00000</strong></p>
      <div class="receipt-body">
        <p>Customer: <span id="receiptCustomer"></span></p>
        <p>Date: <span id="receiptDate"></span></p>
        <div id="receiptItemsList" class="receipt-items-list"></div>
        <div class="receipt-total-row">
          <strong>Final Amount Paid:</strong>
          <strong id="receiptFinalAmount">Rs. 0.00</strong>
        </div>
      </div>
      <button id="closeReceiptBtn" class="btn primary-btn full-width">Return to Store</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
