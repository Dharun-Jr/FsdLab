<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS1510 - Arithmetic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-wrapper">
    <header class="calc-header">
      <h2>CS1510 Calculator</h2>
      <p>Two-Operand Arithmetic &amp; Validation</p>
    </header>

    <main class="calc-body">
      <div class="form-group">
        <label for="num1">First Number (Operand 1):</label>
        <input type="number" id="num1" step="any" placeholder="Enter first number" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="num2">Second Number (Operand 2):</label>
        <input type="number" id="num2" step="any" placeholder="Enter second number" autocomplete="off">
      </div>

      <div class="btn-grid">
        <button type="button" class="op-btn" data-op="add" id="addBtn">+ Add</button>
        <button type="button" class="op-btn" data-op="subtract" id="subBtn">&minus; Subtract</button>
        <button type="button" class="op-btn" data-op="multiply" id="mulBtn">&times; Multiply</button>
        <button type="button" class="op-btn" data-op="divide" id="divBtn">&divide; Divide</button>
      </div>

      <button type="button" class="btn-reset" id="resetBtn">Reset</button>

      <div class="result-box" id="resultBox">
        <span class="result-label">Result:</span>
        <div class="result-value" id="resultDisplay">Enter numbers and select an operation</div>
      </div>

      <div class="history-section">
        <div class="history-header">
          <h3>Recent Operations</h3>
          <button id="clearHistoryBtn" class="btn-link">Clear Log</button>
        </div>
        <ul id="historyList" class="history-list">
          <li class="empty-history">No calculations performed yet.</li>
        </ul>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
